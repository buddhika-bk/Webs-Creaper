# Local / single-host deployment. Secrets come from .env
# Use a secret manager in real production.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webpoint_leads
      MYSQL_USER: webpoint
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "1234"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
      interval: 10s
      retries: 10
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_USER: webpoint
      DB_PASSWORD: "1234"
      DB_NAME: webpoint_leads
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - exports:/app/storage/exports

  worker:
    build: .
    restart: unless-stopped
    command:
      - node
      - dist/workers/index.js
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_USER: webpoint
      DB_PASSWORD: "1234"
      DB_NAME: webpoint_leads
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - exports:/app/storage/exports

volumes:
  mysql-data:
  redis-data:
  exports: